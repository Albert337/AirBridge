<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AirBridge · 跨设备文件互传</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#18202a}.wrap{max-width:920px;margin:0 auto;padding:28px 18px}.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.brand h1{margin:0;font-size:30px}.brand p{margin:8px 0;color:#697586}.status{padding:8px 12px;border-radius:999px;background:#fff;border:1px solid #dfe4ec;font-size:13px}.grid{display:grid;grid-template-columns:340px 1fr;gap:18px;margin-top:20px}.card{background:#fff;border:1px solid #e1e6ee;border-radius:18px;padding:20px;box-shadow:0 8px 30px rgba(20,30,50,.05)}h2{font-size:17px;margin:0 0 14px}.qr{display:flex;justify-content:center;min-height:280px;align-items:center;background:#fafbfc;border-radius:12px}.qr img{width:280px;height:280px}.code{font-size:28px;font-weight:800;letter-spacing:7px;text-align:center;margin:12px 0}.hint{font-size:13px;color:#718096;line-height:1.6;text-align:center}.url{font-size:11px;color:#64748b;background:#f8fafc;border:1px solid #e2e8f0;padding:8px;border-radius:8px;word-break:break-all;margin-top:10px;text-align:center}.manual{display:flex;gap:8px;margin-top:12px}.manual input{flex:1;border:1px solid #d8dee8;border-radius:10px;padding:10px;font-size:16px}.btn{border:0;border-radius:10px;padding:10px 14px;background:#4f67ff;color:white;cursor:pointer;font-weight:650}.btn.secondary{background:#edf1ff;color:#3e50b8}.btn:disabled{opacity:.5;cursor:not-allowed}.drop{border:2px dashed #cbd5e1;border-radius:15px;padding:35px 15px;text-align:center;cursor:pointer;transition:.15s}.drop:hover,.drop.over{background:#f5f8ff;border-color:#6b7cff}.drop strong{display:block;font-size:18px}.drop span{display:block;color:#7a8797;margin-top:7px;font-size:13px}.files{margin-top:15px;display:flex;flex-direction:column;gap:9px}.transfer-section{margin-top:18px}.transfer-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.transfer-title{font-weight:750;font-size:14px}.transfer-actions{display:flex;gap:7px;flex-wrap:wrap}.mini{padding:7px 10px;font-size:12px}.empty{padding:16px;border:1px dashed #d8dee8;border-radius:11px;color:#8a95a5;text-align:center;font-size:12px}.downloaded{border-color:#c9e8d4;background:#f4fbf6}.file{border:1px solid #e5e9f0;border-radius:11px;padding:10px}.row{display:flex;justify-content:space-between;gap:10px}.bar{height:7px;background:#edf0f4;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:#4f67ff}.meta{font-size:12px;color:#7b8794;margin-top:5px}.peer{padding:11px;border-radius:10px;background:#f6f8fb;margin-bottom:12px}.ok{color:#16803c}.warn{color:#a05a00}.error{color:#c2410c;background:#fff7ed;border-color:#fed7aa}.note{font-size:12px;color:#8a95a5;margin-top:12px;line-height:1.6}.network{font-size:12px;color:#64748b;margin-top:12px;padding:10px;border-radius:10px;background:#f8fafc}.network b{color:#334155}.queue{font-size:12px;color:#64748b;margin-top:9px;line-height:1.5}.progress-text{font-size:12px;color:#64748b;margin-top:5px}@media(max-width:720px){.grid{grid-template-columns:1fr}.hero{align-items:center}.qr{min-height:250px}.qr img{width:250px;height:250px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="brand"><h1>AirBridge</h1><p>不用安装 App · 浏览器双向文件互传</p></div>
    <div id="status" class="status">正在连接信令服务…</div>
  </div>
  <div class="grid">
    <section class="card">
      <h2>① 扫码连接</h2>
      <div class="qr"><img id="qr" alt="连接二维码"></div>
      <div id="code" class="code">------</div>
      <div class="hint">手机直接用系统相机扫码<br>二维码已自动使用电脑的局域网 IP</div>
      <div id="url" class="url">正在生成连接地址…</div>
      <div class="manual"><input id="roomInput" maxlength="6" placeholder="输入6位房间码"><button id="joinBtn" class="btn">加入</button></div>
      <div id="network" class="network">正在检测电脑局域网地址…</div>
      <div class="note">如果手机扫码仍提示“无法打开网页”，先让手机和电脑连接同一个 Wi-Fi，然后用手机直接打开上面的连接地址测试。</div>
    </section>
    <section class="card">
      <div class="row" style="align-items:center;margin-bottom:14px"><h2 style="margin:0">② 双向传输</h2><button id="clearAll" class="btn secondary mini">清理全部记录</button></div>
      <div id="peer" class="peer">等待另一台设备加入…</div>
      <label id="drop" class="drop"><strong>选择文件或拖拽到这里</strong><span>连接建立后，双方都可以发送；多个文件会自动排队，避免传输交错</span><input id="picker" type="file" multiple hidden></label>
      <div id="queueInfo" class="queue">发送队列：0 个文件 · 当前：空闲</div>
      <div class="transfer-section">
        <div class="transfer-head">
          <div class="transfer-title">本机 → 对端 · 我发送</div>
          <div class="transfer-actions"><button id="clearSent" class="btn secondary mini">清理</button><button id="downloadSent" class="btn secondary mini">全部下载</button></div>
        </div>
        <div id="sentFiles" class="files"><div class="empty">暂无发送记录</div></div>
      </div>
      <div class="transfer-section">
        <div class="transfer-head">
          <div class="transfer-title">对端 → 本机 · 我接收</div>
          <div class="transfer-actions"><button id="clearReceived" class="btn secondary mini">清理</button><button id="downloadReceived" class="btn secondary mini">全部下载</button></div>
        </div>
        <div id="receivedFiles" class="files"><div class="empty">暂无接收文件</div></div>
      </div>
    </section>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
let ws,room=new URLSearchParams(location.search).get('room')||'',peer=null,dc=null,connected=false;
const CHUNK=32*1024;
const HIGH_WATER=1024*1024;
const LOW_WATER=256*1024;
const transfers=new Map();
const sendQueue=[];
let sending=false;
let incoming=null;
const pendingAcks=new Map();

function setStatus(t,cls=''){ $('status').textContent=t; $('status').className='status '+cls; }
function wsUrl(){return `${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`}
function signal(data){if(ws?.readyState===1)ws.send(JSON.stringify({type:'signal',data}))}
function createPC(initiator){
 const pc=new RTCPeerConnection({iceServers:[]});
 pc.onicecandidate=e=>{if(e.candidate)signal({kind:'ice',candidate:e.candidate})};
 pc.onconnectionstatechange=()=>{
   if(pc.connectionState==='connected'){connected=true;setStatus('已建立 P2P 连接','ok');$('peer').innerHTML='<b class="ok">● 设备已连接</b><br>可以双向发送文件';}
   if(['failed','disconnected','closed'].includes(pc.connectionState)){connected=false;setStatus('P2P 连接已断开','warn');}
 };
 if(initiator){const ch=pc.createDataChannel('files',{ordered:true});setupChannel(ch);pc.createOffer().then(o=>pc.setLocalDescription(o)).then(()=>signal({kind:'offer',sdp:pc.localDescription}));}
 pc.ondatachannel=e=>setupChannel(e.channel); peer=pc; return pc;
}
function setupChannel(ch){
 dc=ch;ch.binaryType='arraybuffer';ch.bufferedAmountLowThreshold=LOW_WATER;
 ch.onopen=()=>{connected=true;setStatus('已建立 P2P 连接','ok');$('peer').innerHTML='<b class="ok">● 设备已连接</b><br>可以双向发送文件';};
 ch.onclose=()=>{connected=false;setStatus('P2P 连接已关闭','warn')};
 ch.onerror=()=>setStatus('P2P 数据通道异常','warn');
 ch.onmessage=handleData;
}
function sendControl(obj){if(dc?.readyState==='open')dc.send(JSON.stringify(obj));}
function removeEmpty(container){const e=container.querySelector('.empty');if(e)e.remove();}
function ensureEmpty(container,msg){if(!container.children.length)container.innerHTML=`<div class="empty">${msg}</div>`;}
function makeId(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}
function handleData(e){
 if(typeof e.data==='string'){
   let m;try{m=JSON.parse(e.data)}catch{return;}
   if(m.type==='file-start'){
     // 协议层仍然允许一次只存在一个接收文件；发送端已经串行化，避免裸 binary chunk 交错。
     if(incoming){
       // 对异常/旧客户端，主动结束旧状态，避免后续所有 chunk 被错误归属。
       const old=transfers.get(incoming.id);if(old&&old.status==='receiving')old.status='error';
     }
     incoming={name:m.name,size:m.size,received:0,parts:[],id:m.id};
     transfers.set(m.id,{id:m.id,name:m.name,size:m.size,received:0,direction:'received',status:'receiving',blob:null});
     addFileUI(m.id,m.name,m.size,true); updateFileUI(m.id,0,m.size);
   } else if(m.type==='file-end'){
     if(!incoming||incoming.id!==m.id)return;
     const current=incoming;
     const item=transfers.get(current.id);
     if(current.received!==current.size){
       if(item)item.status='error';
       updateFileStatus(current.id,`接收异常：${format(current.received)} / ${format(current.size)}`,'warn');
       sendControl({type:'file-error',id:current.id,message:'接收数据不完整'});
       incoming=null;return;
     }
     const blob=new Blob(current.parts);
     if(item){item.blob=blob;item.status='complete';item.received=current.size;}
     updateFileUI(current.id,current.size,current.size);
     markReceivedComplete(current.id);
     sendControl({type:'file-complete',id:current.id});
     incoming=null;
   } else if(m.type==='file-complete'){
     const waiter=pendingAcks.get(m.id);if(waiter){clearTimeout(waiter.timer);pendingAcks.delete(m.id);waiter.resolve();}
     const item=transfers.get(m.id);if(item&&item.direction==='sent'){item.status='complete';updateFileUI(m.id,item.size,item.size);updateFileStatus(m.id,'接收端已确认完成','ok');}
   } else if(m.type==='file-error'){
     const waiter=pendingAcks.get(m.id);if(waiter){clearTimeout(waiter.timer);pendingAcks.delete(m.id);waiter.reject(new Error(m.message||'接收端报告失败'));}
     updateFileStatus(m.id,m.message||'对端接收失败','warn');
   }
 } else if(incoming){
   incoming.parts.push(e.data);incoming.received+=e.data.byteLength;
   const item=transfers.get(incoming.id);if(item)item.received=incoming.received;
   updateFileUI(incoming.id,incoming.received,incoming.size);
 }
}
function addFileUI(id,name,size,recv=false){
 const container=recv?$('receivedFiles'):$('sentFiles');removeEmpty(container);
 const d=document.createElement('div');d.className='file';d.dataset.id=id;
 d.innerHTML=`<div class="row"><b title="${escapeHtml(name)}">${escapeHtml(name)}</b><span>${recv?'接收':'发送'}</span></div><div class="bar"><i></i></div><div class="meta">0 B / ${format(size)} · 0%</div><div class="file-actions" style="margin-top:8px;display:flex;gap:7px"></div>`;
 container.prepend(d);
}
function updateFileUI(id,n,total){const d=document.querySelector(`[data-id="${CSS.escape(id)}"]`);if(!d)return;d.querySelector('i').style.width=Math.min(100,total?n/total*100:0)+'%';d.querySelector('.meta').textContent=`${format(n)} / ${format(total)} · ${Math.round(total?n/total*100:0)}%`}
function updateFileStatus(id,text,cls=''){const d=document.querySelector(`[data-id="${CSS.escape(id)}"]`);if(!d)return;const meta=d.querySelector('.meta');meta.textContent=text;meta.className='meta '+cls;}
function markReceivedComplete(id){const item=transfers.get(id);const d=document.querySelector(`[data-id="${CSS.escape(id)}"]`);if(!d||!item)return;d.classList.add('downloaded');d.querySelector('.file-actions').innerHTML=`<button class="btn secondary mini" onclick="downloadOne('${id}')">下载</button>`;updateFileStatus(id,`${format(item.size)} · 接收完成`,'ok')}
function format(n){if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';if(n<1073741824)return(n/1048576).toFixed(1)+' MB';return(n/1073741824).toFixed(2)+' GB'}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function waitForBuffer(){
 if(!dc||dc.readyState!=='open')return Promise.reject(new Error('数据通道未连接'));
 if(dc.bufferedAmount<=HIGH_WATER)return Promise.resolve();
 return new Promise(resolve=>{
   let done=false;
   const finish=()=>{if(done)return;done=true;clearInterval(timer);dc.removeEventListener('bufferedamountlow',finish);resolve();};
   const timer=setInterval(()=>{if(!dc||dc.readyState!=='open'||dc.bufferedAmount<=LOW_WATER)finish();},20);
   dc.addEventListener('bufferedamountlow',finish,{once:true});
 });
}
function waitForAck(id,timeout=120000){return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pendingAcks.delete(id);reject(new Error('等待接收端确认超时'))},timeout);pendingAcks.set(id,{resolve,reject,timer});});}
async function sendFile(file){
 if(!dc||dc.readyState!=='open')throw new Error('请先等待另一台设备连接');
 const id=makeId();
 transfers.set(id,{id,name:file.name,size:file.size,received:0,direction:'sent',status:'sending',blob:file});
 addFileUI(id,file.name,file.size,false);updateFileStatus(id,'等待接收端确认…');
 sendControl({type:'file-start',id,name:file.name,size:file.size});
 let off=0;
 while(off<file.size){
   await waitForBuffer();
   const buf=await file.slice(off,Math.min(off+CHUNK,file.size)).arrayBuffer();
   if(!dc||dc.readyState!=='open')throw new Error('传输过程中连接断开');
   dc.send(buf);off+=buf.byteLength;updateFileUI(id,off,file.size);
 }
 sendControl({type:'file-end',id});
 updateFileStatus(id,'数据已发送，等待接收端确认…');
 await waitForAck(id);
 updateFileStatus(id,'发送完成（接收端已确认）','ok');
}
async function processQueue(){
 if(sending)return;sending=true;
 while(sendQueue.length){
   const file=sendQueue.shift();updateQueueInfo(file.name);
   try{await sendFile(file);}catch(e){console.error(e);const last=[...transfers.values()].reverse().find(x=>x.name===file.name&&x.direction==='sent'&&x.status==='sending');if(last){last.status='error';updateFileStatus(last.id,'发送失败：'+e.message,'warn')}}
 }
 sending=false;updateQueueInfo('空闲');
}
function enqueueFiles(files){if(!connected||!dc||dc.readyState!=='open')return alert('请先等待另一台设备连接');sendQueue.push(...files);updateQueueInfo('排队中');processQueue();}
function updateQueueInfo(current='空闲'){ $('queueInfo').textContent=`发送队列：${sendQueue.length} 个文件 · 当前：${sending?(current==='排队中'?'发送中…':current):'空闲'}`;}
function browserDownload(item){const url=URL.createObjectURL(item.blob);const a=document.createElement('a');a.href=url;a.download=item.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
window.downloadOne=async function(id){const item=transfers.get(id);if(!item?.blob)return alert('文件尚未接收完成');browserDownload(item)};
async function downloadGroup(direction){
 const list=[...transfers.values()].filter(x=>x.direction===direction&&x.status==='complete'&&x.blob);
 if(!list.length)return alert(direction==='sent'?'暂无可下载的发送文件':'暂无可下载的接收文件');
 // 只有“接收端 → 全部下载”时才让用户选择一次目标文件夹，避免页面底部长期占用空间。
 if(direction==='received'){
   if(!window.showDirectoryPicker){
     alert('当前浏览器不支持网页直接选择下载文件夹，将使用系统默认下载位置。');
     list.forEach(browserDownload);
     return;
   }
   try{
     const dir=await window.showDirectoryPicker({mode:'readwrite'});
     for(const item of list){
       const handle=await dir.getFileHandle(item.name,{create:true});
       const writable=await handle.createWritable();
       await writable.write(item.blob);
       await writable.close();
     }
     alert(`已将 ${list.length} 个接收文件保存到所选文件夹。`);
   }catch(e){
     if(e.name!=='AbortError')alert('保存文件失败：'+e.message);
   }
   return;
 }
 list.forEach(browserDownload);
}
function clearTransfers(direction){for(const [id,item] of [...transfers]){if(direction&&item.direction!==direction)continue;if(item.direction==='sent'&&item.status==='sending')continue;transfers.delete(id);const el=document.querySelector(`[data-id="${CSS.escape(id)}"]`);if(el)el.remove()}ensureEmpty($('sentFiles'),'暂无发送记录');ensureEmpty($('receivedFiles'),'暂无接收文件')}
function join(code){room=String(code).replace(/\D/g,'').slice(0,6);if(room.length!==6)return alert('请输入6位房间码');$('code').textContent=room;history.replaceState(null,'',`/?room=${room}`);if(ws?.readyState===1)ws.send(JSON.stringify({type:'join',room}))}
async function newRoom(){try{const r=await fetch('/api/room').then(x=>x.json());$('qr').src=r.qr;$('code').textContent=r.code;$('roomInput').value=r.code;room=r.code;$('url').textContent=r.url;$('network').innerHTML=r.lan?.length?'<b>电脑局域网地址：</b>'+r.lan.map(x=>`${x.name}: ${x.address}`).join(' · '):'<span class="warn">未检测到局域网 IPv4</span>';history.replaceState(null,'',`/?room=${room}`);join(room)}catch(e){setStatus('无法生成房间','warn');$('url').textContent='请检查服务器是否正常运行'}}
function connect(){try{ws=new WebSocket(wsUrl())}catch(e){setStatus('无法连接信令服务','warn');return}ws.onopen=()=>{setStatus('信令服务已连接');if(room)join(room);else newRoom()};ws.onerror=()=>setStatus('信令服务连接失败','warn');ws.onclose=()=>setStatus('信令服务断开','warn');ws.onmessage=async e=>{const m=JSON.parse(e.data);if(m.type==='joined')$('peer').textContent=m.count>1?'正在建立 P2P 连接…':'等待另一台设备加入…';if(m.type==='peer-joined'){if(!peer)createPC(true)}if(m.type==='peer-left'){$('peer').textContent='对方已离开房间';connected=false}if(m.type==='error')$('peer').textContent=m.message;if(m.type==='signal'){if(m.data.kind==='offer'){const pc=createPC(false);await pc.setRemoteDescription(m.data.sdp);const a=await pc.createAnswer();await pc.setLocalDescription(a);signal({kind:'answer',sdp:pc.localDescription})}else if(m.data.kind==='answer'&&peer){await peer.setRemoteDescription(m.data.sdp)}else if(m.data.kind==='ice'&&peer){try{await peer.addIceCandidate(m.data.candidate)}catch{}}}}}
$('joinBtn').onclick=()=>join($('roomInput').value);
$('picker').onchange=e=>{enqueueFiles([...e.target.files]);e.target.value=''};
$('drop').onclick=e=>{if(e.target.tagName!=='INPUT')$('picker').click()};
$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('over')};
$('drop').ondragleave=()=>$('drop').classList.remove('over');
$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('over');enqueueFiles([...e.dataTransfer.files])};
$('downloadSent').onclick=()=>downloadGroup('sent');$('downloadReceived').onclick=()=>downloadGroup('received');$('clearSent').onclick=()=>clearTransfers('sent');$('clearReceived').onclick=()=>clearTransfers('received');$('clearAll').onclick=()=>clearTransfers();
connect();
</script>
</body>
</html>
